[project]
name = "aipi-backend"
version = "0.1.0"
description = "AI Property Intelligence Vietnam — backend (API, ingestion, ML)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0,<3",
]
dev = [
    "mcp>=2.0,<3",
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ingestion*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: test cần PostgreSQL (đặt biến TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() trong tham số mặc định là cách dùng chuẩn của FastAPI

[tool.ruff.lint.isort]
known-first-party = ["app", "ingestion", "mcp_server"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
